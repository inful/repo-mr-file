name: probe-pkg
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: {TOKEN: ${{secrets.GITHUB_TOKEN}}}
        run: |
          echo "Testing /user/packages/..."
          curl -sIL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user/packages/container/repo-mr-file" 2>&1 | head -3
          echo ""
          echo "Testing /users/inful/packages/..."
          curl -sIL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/users/inful/packages/container/repo-mr-file" 2>&1 | head -3
          echo ""
          echo "Testing /orgs/inful/packages/..."
          curl -sIL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/orgs/inful/packages/container/repo-mr-file" 2>&1 | head -3
          echo ""
          echo "Testing /repos/inful/repo-mr-file/packages/container/..."
          curl -sIL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/inful/repo-mr-file/packages/container/repo-mr-file" 2>&1 | head -3
